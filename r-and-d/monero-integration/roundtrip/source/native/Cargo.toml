[package]
name = "pedpop-wallet-type-join"
version = "0.0.0"
edition = "2021"
autotests = false

[features]
synthetic-host = []
node-host = ["synthetic-host", "dep:serde_json"]
participant-host = ["node-host", "dep:k256", "dep:blake2"]

[[bin]]
name = "monero-participant"
path = "src/bin/monero_participant.rs"
required-features = ["participant-host"]

[[bin]]
name = "synthetic-candidate-host"
path = "src/bin/synthetic_candidate_host.rs"
required-features = ["synthetic-host"]

[dependencies]
monero-wallet = { version = "=0.2.0", features = ["multisig"] }
frost = { package = "modular-frost", version = "=0.11.1", default-features = false, features = ["ed25519"] }
dkg = "=0.6.1"
dkg-pedpop = "=0.6.0"
schnorr-signatures = "=0.5.1"
ciphersuite = "=0.4.2"
dalek-ff-group = "=0.5.0"
curve25519-dalek = "=4.1.3"
transcript = { package = "flexible-transcript", version = "=0.3.4", features = ["recommended"] }
monero-clsag = { version = "=0.1.0", features = ["multisig"] }
monero-ed25519 = "=0.1.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.0"
sha2 = "=0.10.9"
dleq = { version = "=0.4.1", features = ["serialize"] }
serde_json = { version = "=1.0.145", optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"], optional = true }
blake2 = { version = "=0.10.6", optional = true }
